version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hyrox-postgres
    environment:
      POSTGRES_USER: hyrox_user
      POSTGRES_PASSWORD: hyrox_password
      POSTGRES_DB: hyrox_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hyrox_user -d hyrox_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
